[workspace]
members = ["crates/cli", "crates/core", "crates/web"]
resolver = "3"

# One version for the CLI and every runtime crate (ADR-0017): a project generated by puerto 0.x
# asks for runtime 0.x, so the two can never drift apart.
[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Guuri11/Puerto"
homepage = "https://github.com/Guuri11/Puerto"
