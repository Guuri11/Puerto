[workspace]
members = ["crates/cli", "crates/core", "crates/macros", "crates/web", "crates/sqlx", "crates/events", "crates/kafka", "crates/mail", "crates/auth"]
resolver = "3"

# One version for the CLI and every runtime crate (ADR-0017): a project generated by puerto 0.x
# asks for runtime 0.x, so the two can never drift apart.
[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Guuri11/Puerto"
homepage = "https://github.com/Guuri11/Puerto"

# A runtime crate depending on another: published with this version, built from the checkout. Bump
# it with `[workspace.package] version` — crates.io resolves the `version`, not the `path`.
[workspace.dependencies]
puerto-core = { version = "0.19.0", path = "crates/core" }
puerto-macros = { version = "0.19.0", path = "crates/macros" }
puerto-web = { version = "0.19.0", path = "crates/web" }
