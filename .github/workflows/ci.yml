name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # `puerto-kafka` builds librdkafka from source (`rdkafka/cmake-build`).
      - name: Install cmake
        run: sudo apt-get install -y cmake

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Format check
        run: cargo fmt --all -- --check

  # The gate `.claude/rules/release.md` calls "the most important" one: generates real projects,
  # scaffolds into them and compiles + tests the result. It used to run only on tag push, which is
  # how three bugs that produced non-compiling projects reached main. Separate job so the fast
  # feedback loop above is not slowed down by it.
  test-full:
    name: Compile matrix (generated projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # `puerto-kafka`, and the `--events kafka` scenario's worker, build librdkafka from source.
      - name: Install cmake
        run: sudo apt-get install -y cmake

      # The web scenarios install, lint and test the generated frontend.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Generate, compile and test projects
        run: make test/full
