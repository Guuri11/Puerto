name: Release

# Pushing a `v*` tag publishes the crate. A version already on crates.io (published by hand with
# `cargo publish -p puerto --locked`, the documented fallback) is skipped, not failed: crates.io
# never accepts the same version twice, and a red run for a release that is out is noise.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Tag matches the crate version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "puerto") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/cli/Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Already on crates.io?
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'puerto-release (github.com/Guuri11/Puerto)' \
            "https://crates.io/api/v1/crates/puerto/${{ steps.version.outputs.version }}")
          if [ "$status" = "200" ]; then
            echo "::notice::puerto ${{ steps.version.outputs.version }} is already on crates.io — skipping publish"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Full test (generates real projects + compiles)
        if: steps.published.outputs.done == 'false'
        run: make test/full

      # --locked: build with the committed Cargo.lock, never re-resolved dependencies (a fresh
      # resolution pulled kstring 2.0.5, which needs a newer Rust than ours — see 0.10.1).
      - name: Publish to crates.io
        if: steps.published.outputs.done == 'false'
        run: cargo publish -p puerto --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
