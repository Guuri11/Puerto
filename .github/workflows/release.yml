name: Release

# Pushing a `v*` tag publishes the runtime crates, then `puerto`. A crate whose version is already
# on crates.io (published by hand with `cargo publish -p <crate> --locked`, the documented
# fallback) is skipped, not failed: crates.io never accepts the same version twice, and a red run
# for a release that is out is noise.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Every published crate shares the workspace version (ADR-0017): the tag must match each.
      - name: Tag matches every crate version
        id: version
        run: |
          versions=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')
          echo "$versions"
          while read -r name version; do
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match $name version $version"
              exit 1
            fi
          done <<< "$versions"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Full test (generates real projects + compiles)
        run: make test/full

      # Runtime crates first, in dependency order: `puerto` itself depends on none of them, but a
      # project generated by this release asks crates.io for them. Each crate already on
      # crates.io (published by hand — the documented fallback) is skipped, not failed: crates.io
      # never accepts the same version twice. --locked: build with the committed Cargo.lock, never
      # re-resolved dependencies (a fresh resolution pulled kstring 2.0.5, which needs a newer Rust
      # than ours — see 0.10.1).
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for crate in puerto-core puerto-web puerto; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'puerto-release (github.com/Guuri11/Puerto)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$status" = "200" ]; then
              echo "::notice::$crate $VERSION is already on crates.io — skipping"
            else
              cargo publish -p "$crate" --locked
            fi
          done
