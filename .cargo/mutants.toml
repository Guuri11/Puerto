# cargo-mutants configuration — `make test/mutation`.
#
# Scoped to Puerto's pure logic, where a surviving mutant is a rule that can break with every test
# still green: name/field validation, migration versioning, the type registry and the patchers
# that rewrite user files. Template rendering is covered by the compile matrix (`make test/full`),
# which mutation testing cannot run per-mutant in reasonable time.
examine_globs = [
    "crates/cli/src/validation.rs",
    "crates/cli/src/generators/migration.rs",
    "crates/cli/src/generators/types.rs",
    "crates/cli/src/generators/naming.rs",
    "crates/cli/src/generators/web.rs",
    "crates/cli/src/generators/worker.rs",
    "crates/cli/src/patchers/*.rs",
    "crates/cli/src/runtime.rs",
    # Runtime crates: their code ships in every generated project.
    "crates/core/src/**/*.rs",
    "crates/web/src/*.rs",
    "crates/sqlx/src/**/*.rs",
    "crates/events/src/**/*.rs",
    "crates/kafka/src/**/*.rs",
]
# The process boundary of `puerto-web`: binding a port, waiting for SIGTERM, reading the real
# environment. A mutant there only shows when a server runs — no unit test can catch it without
# starting one. Everything they call (`wrap`, `routes`, `Config::from_vars`) is examined.
exclude_re = [
    "App::serve",
    "shutdown_signal",
    "Config::from_env",
    "init_tracing",
    "load_dotenv",
    # The same boundary in `puerto-events`: `Worker::run` installs tracing and waits for the
    # signal; `run_until` (the loops, the probes, the drain) is examined.
    "Worker::run ->",
    "WorkerConfig::from_env",
    # `puerto-sqlx` against a live server: a mutant of these shows only with Postgres running —
    # `make test/db` runs that (`postgres_*` in crates/sqlx). `map_sqlx_error` is examined.
    "replace ping ",
    "run_migrations",
    # The unit of work, the outbox and the db transport: every query is checked by
    # `crates/sqlx/tests/events_postgres.rs` under `make test/db`. Their pure parts (routing,
    # the row → envelope conversion) are examined.
    "PgTransaction::",
    "OutboxRow::from_pg",
    "replace envelope_from_pg ",
    "for PgOutbox>::",
    "for PgDeadLetters>::",
    "for PgDeliveries>::publish",
    "for PgSubscription>::(next_batch|settle)",
    # `puerto-kafka` against a live broker: `make test/kafka` (`kafka_*` in crates/kafka). The
    # envelope ↔ record mapping (`wire`), the config and the retry ledger are examined.
    "KafkaConfig::(from_env|client|ensure_topics)",
    "KafkaPublisher::new",
    "for KafkaPublisher>::publish",
    "KafkaSubscription::",
    "for KafkaSubscription>::",
    "Position::of",
]
# The compile matrix is `#[ignore]`d; a mutant run uses the fast structural suite only.
test_tool = "nextest"
