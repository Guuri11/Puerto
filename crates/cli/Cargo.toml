[package]
name = "puerto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puerto — Rust full-stack DDD framework CLI. Scaffolds Clean Architecture projects with auto-wired DI, SQLx support, and zero manual wiring. Formerly puerto-framework."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ddd", "scaffold", "framework", "clean-architecture", "code-generator"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    # Snapshots of generated output (T-18): test data, ~24k lines nobody installing needs.
    "!src/tests/snapshots/**",
    "template",
    "Cargo.toml",
    "README.md",
]

[[bin]]
name = "puerto"
path = "src/main.rs"

[dependencies]
cargo-generate = "0.23"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = "0.11"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tera = "1"
toml = "0.8"

[dev-dependencies]
insta = "1"
# `make test/kafka`: the end-to-end test writes a record that is not an event.
rdkafka = { version = "0.39", features = ["cmake-build"] }
