[package]
name = "puerto-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puerto runtime — auth for Puerto projects: the OIDC adapter of the Authenticator port (Auth0, Keycloak or any OpenID Connect provider) and argon2id password hashing for local accounts."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ddd", "puerto", "auth", "oidc", "jwt"]
categories = ["authentication", "web-programming"]

[features]
# The OIDC adapter (ADR-0021 § 1): `OidcAuthenticator`, `OidcConfig`, `RolesClaim`.
oidc = ["dep:jsonwebtoken", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:tokio"]
# Local accounts (ADR-0021 § 2): `local::Argon2Hasher`, the `PasswordHasher` of a `--auth local`
# project. The sessions are `puerto-sqlx`'s.
local = ["dep:argon2", "dep:tokio", "tokio/rt"]

[dependencies]
puerto-core = { workspace = true }
async-trait = "0.1"
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
# Verification only, never signing: the pure-Rust backend, so no C toolchain (aws-lc-rs needs one).
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"], optional = true }
# rustls, not native-tls: no OpenSSL headers to install.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
# argon2id with the crate's defaults (19 MiB, 2 passes): what OWASP recommends. Pure Rust.
argon2 = { version = "0.5", features = ["std"], optional = true }
uuid = "1"

[dev-dependencies]
# Its own features for its tests: `make test` builds the workspace without features.
puerto-auth = { path = ".", features = ["oidc", "local"] }
# PEM keys sign the test tokens.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
base64 = "0.22"
poem = "3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
