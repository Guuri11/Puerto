[package]
name = "puerto-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puerto runtime — the HTTP shell every Puerto project shares: server, graceful shutdown, health probes, config, CORS, the error body and bearer auth."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ddd", "clean-architecture", "puerto", "poem", "openapi"]
categories = ["web-programming::http-server"]

[dependencies]
# Auth (ADR-0021): the `Authenticator` port `BearerAuth` asks, and `#[require_role]`.
puerto-core = { workspace = true }
puerto-macros = { workspace = true }
poem = "3"
poem-openapi = { version = "5", features = ["swagger-ui"] }
tokio = { version = "1", features = ["macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"

[dev-dependencies]
puerto-core = { workspace = true, features = ["test-utils"] }
serde_json = "1"
uuid = "1"
poem = { version = "3", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
