[package]
name = "puerto-eventos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runtime de Puerto: el worker de todo proyecto Puerto con eventos de dominio: el relay del outbox, los bucles de consumo y su política de entrega, las sondas de salud y el apagado ordenado."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ddd", "clean-architecture", "puerto", "events", "outbox"]
categories = ["asynchronous"]

[dependencies]
puerto-nucleo = { workspace = true }
puerto-web = { workspace = true }
async-trait = "0.1"
poem = "3"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
uuid = { version = "1", features = ["v7"] }
