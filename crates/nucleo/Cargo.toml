[package]
name = "puerto-nucleo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runtime de Puerto: los tipos de dominio que comparte todo proyecto Puerto: listas paginadas, el error de repositorio, los eventos de dominio y los puertos que implementan sus transportes, los puertos del correo y el de auth."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ddd", "clean-architecture", "puerto", "events", "auth"]
categories = ["rust-patterns"]

[features]
# `auth::dobles::MockAutenticador`, for a project's tests.
pruebas = ["dep:mockall"]

[dependencies]
thiserror = "2"
# Domain events (ADR-0018): the envelope, the handler and transport ports, the delivery policy.
async-trait = "0.1"
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
mockall = { version = "0.13", optional = true }

[dev-dependencies]
mockall = "0.13"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
