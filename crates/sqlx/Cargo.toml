[package]
name = "puerto-sqlx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puerto runtime — the Postgres adapter every Puerto project with a database shares: the pool, migrations at startup, the readiness ping, the driver-error mapping, the unit of work, outbox and event delivery store, and the sent-mail log."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ddd", "clean-architecture", "puerto", "sqlx", "postgres"]
categories = ["database"]

[dependencies]
puerto-core = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "uuid", "chrono", "json"] }
thiserror = "2"
# Domain events (ADR-0018): the unit of work, the outbox and the db transport.
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
