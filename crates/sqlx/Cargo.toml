[package]
name = "puerto-sqlx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runtime de Puerto: el adaptador de Postgres que comparte todo proyecto Puerto con base de datos: el pool, las migraciones al arrancar, la sonda de disponibilidad, la traducción de los errores del driver, la unidad de trabajo, el outbox y el almacén de entregas de eventos, el registro de correos enviados, y las sesiones y credenciales de las cuentas locales."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ddd", "clean-architecture", "puerto", "sqlx", "postgres"]
categories = ["database"]

[dependencies]
puerto-nucleo = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "uuid", "chrono", "json"] }
thiserror = "2"
# Domain events (ADR-0018): the unit of work, the outbox and the db transport.
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
# Local accounts (ADR-0021 § 2): session tokens and their hashes, `AUTH_SESSION_TTL` from `.env`.
base64 = "0.22"
dotenvy = "0.15"
getrandom = "0.3"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
